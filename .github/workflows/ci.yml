name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  check:
    name: flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - uses: cachix/cachix-action@v16
        with:
          name: noctalia
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          extraPullNames: ""

      # Builds every host toplevel and home-manager user (flake-modules/checks.nix)
      # plus statix, treefmt, and host discovery.
      - run: nix flake check ./nixos --print-build-logs

  check-format:
    name: check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - uses: cachix/cachix-action@v16
        with:
          name: noctalia
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          extraPullNames: ""

      - name: Check formatting with treefmt
        run: |
          cd nixos && nix fmt -- --fail-on-change
        shell: bash

  lint:
    name: lint with statix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - uses: cachix/cachix-action@v16
        with:
          name: noctalia
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          extraPullNames: ""

      - name: Run statix check
        run: |
          nix run nixpkgs#statix check ./nixos

  devshell:
    name: build default devshell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - uses: cachix/cachix-action@v16
        with:
          name: noctalia
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          extraPullNames: ""

      - name: Build default devshell
        run: |
          nix build ./nixos#devShells.x86_64-linux.default \
            --print-build-logs

  evaluate:
    name: evaluate flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - uses: cachix/cachix-action@v16
        with:
          name: noctalia
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          extraPullNames: ""

      - name: Evaluate all attributes
        run: |
          nix eval ./nixos# --apply 'x: builtins.deepSeq x x' 2>&1 | head -100
          echo "✅ Flake evaluated successfully"
